
version: '3.8'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false  # 关闭安全认证（测试环境适用）
      - ES_JAVA_OPTS=-Xms2g -Xmx2g    # JVM 内存分配
    volumes:
      - es_data:/usr/share/elasticsearch/data  # 数据持久化
    ports:
      - "9200:9200"
    networks:
      - elk_network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.9.0
    container_name: logstash
    volumes:
      - ./logstash/config:/usr/share/logstash/config  # 全局配置
      - ./logstash/pipeline:/usr/share/logstash/pipeline  # 管道配置
    environment:
      - LS_JAVA_OPTS=-Xms1g -Xmx1g  # Logstash 内存限制
    ports:
      - "5044:5044"  # Filebeat 输入端口
    depends_on:
      - elasticsearch
    networks:
      - elk_network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - elk_network

volumes:
  es_data:
    driver: local

networks:
  elk_network:
    driver: bridge
