version: '3.8'

services:
  # Prometheus 监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml  # 挂载配置文件
      - prometheus_data:/prometheus  # 数据持久化
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - monitoring

  # InfluxDB 时序数据库
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb  # 数据持久化
    environment:
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
      - INFLUXDB_DB=mydb  # 默认数据库
    networks:
      - monitoring

  # Grafana 可视化平台
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana  # 数据持久化
      - ./grafana/provisioning:/etc/grafana/provisioning  # 预配置数据源
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=grafana123  # 管理员密码
    depends_on:
      - prometheus
      - influxdb
    networks:
      - monitoring

  mysql_exporter:
    image: prom/mysqld-exporter:latest
    container_name: mysql_exporter
    ports:
      - "9104:9104"
    volumes:
      - ./mysql-exporter/.my.cnf:/etc/mysql-exporter.cnf
    command: 
      - "--config.my-cnf=/etc/mysql-exporter.cnf"
    environment:
      - DATA_SOURCE_NAME=exporter:123456@mysql_host:3306/
    networks:
      - monitoring

# 网络与存储卷配置
networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  influxdb_data:
  grafana_data: